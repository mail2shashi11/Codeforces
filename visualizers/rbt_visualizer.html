<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red-Black Tree Visualizer</title>
  <style>
    :root {
      --bg-1: #071a2e;
      --bg-2: #133b5c;
      --panel: rgba(255, 255, 255, 0.1);
      --panel-border: rgba(255, 255, 255, 0.16);
      --card: #f7fbff;
      --ink: #11263f;
      --blue: #00a6fb;
      --green: #06d6a0;
      --orange: #ff9f1c;
      --red: #ef476f;
      --gray: #5f6c7b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      color: #eaf3ff;
      background: radial-gradient(circle at 15% 20%, #1f4f7b 0%, var(--bg-1) 45%),
                  linear-gradient(145deg, var(--bg-2) 0%, var(--bg-1) 100%);
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      padding: 18px;
    }

    .title {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .sub {
      color: #d2e6ff;
      font-size: 0.93rem;
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #deebff;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: #edf4ff;
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 800;
      font-size: 0.88rem;
      color: #fff;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.07);
    }

    .insert { background: linear-gradient(135deg, var(--green), #24b889); }
    .delete { background: linear-gradient(135deg, var(--red), #c71f49); }
    .query { background: linear-gradient(135deg, var(--orange), #f77f00); }
    .action { background: linear-gradient(135deg, #3a86ff, var(--blue)); }
    .reset { background: linear-gradient(135deg, #7f8ea3, var(--gray)); }

    .output {
      margin-top: 6px;
      min-height: 76px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.28);
      padding: 10px;
      white-space: pre-wrap;
      line-height: 1.4;
      color: #eef5ff;
      font-size: 0.9rem;
    }

    .viewer {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .canvas {
      background: var(--card);
      border: 1px solid #cde2ff;
      border-radius: 14px;
      min-height: 560px;
      padding: 10px;
      overflow: auto;
    }

    svg {
      width: 100%;
      height: 100%;
      min-height: 540px;
    }

    .tree-text {
      min-height: 140px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 10px;
      white-space: pre;
      overflow: auto;
      color: #eef5ff;
      font-size: 0.9rem;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
      .canvas {
        min-height: 430px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="panel">
      <div class="title">Red-Black Visualizer</div>
      <div class="sub">Operations: insert, delete, search, traversals, node height, black-height, print tree, clear.</div>

      <div class="controls">
        <div>
          <label for="valueInput">Node Value</label>
          <input id="valueInput" type="number" placeholder="e.g. 30 or 10,20,40" />
        </div>

        <div class="btn-grid">
          <button class="insert" id="insertBtn">Insert</button>
          <button class="delete" id="deleteBtn">Delete</button>
          <button class="query" id="searchBtn">Search Node</button>
          <button class="query" id="heightBtn">Node Height</button>
        </div>

        <div class="btn-grid">
          <button class="action" id="preBtn">Preorder</button>
          <button class="action" id="inBtn">Inorder</button>
          <button class="action" id="postBtn">Postorder</button>
          <button class="action" id="levelBtn">Levelorder</button>
        </div>

        <div class="btn-grid">
          <button class="action" id="blackBtn">Black Height</button>
          <button class="action" id="printBtn">Print Tree</button>
          <button class="action" id="bulkBtn">Insert CSV</button>
          <button class="reset" id="clearBtn">Clear Tree</button>
        </div>

        <div class="output" id="output">Ready.</div>
      </div>
    </aside>

    <section class="panel viewer">
      <div class="stats" id="stats"></div>
      <div class="canvas">
        <svg id="treeSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <pre class="tree-text" id="treeText">Tree print will appear here.</pre>
    </section>
  </div>

  <script>
    const RED = "RED";
    const BLACK = "BLACK";

    class RBNode {
      constructor(value, color = RED) {
        this.value = value;
        this.color = color;
        this.left = null;
        this.right = null;
        this.parent = null;
      }
    }

    class RBTree {
      constructor() {
        this.NIL = new RBNode(0, BLACK);
        this.NIL.left = this.NIL;
        this.NIL.right = this.NIL;
        this.NIL.parent = this.NIL;
        this.root = this.NIL;
      }

      isEmpty() {
        return this.root === this.NIL;
      }

      leftRotate(x) {
        const y = x.right;
        x.right = y.left;
        if (y.left !== this.NIL) y.left.parent = x;
        y.parent = x.parent;
        if (x.parent === this.NIL) this.root = y;
        else if (x === x.parent.left) x.parent.left = y;
        else x.parent.right = y;
        y.left = x;
        x.parent = y;
      }

      rightRotate(y) {
        const x = y.left;
        y.left = x.right;
        if (x.right !== this.NIL) x.right.parent = y;
        x.parent = y.parent;
        if (y.parent === this.NIL) this.root = x;
        else if (y === y.parent.left) y.parent.left = x;
        else y.parent.right = x;
        x.right = y;
        y.parent = x;
      }

      insert(value) {
        if (this.searchNode(value) !== this.NIL) return false;
        const z = new RBNode(value, RED);
        z.left = this.NIL;
        z.right = this.NIL;

        let y = this.NIL;
        let x = this.root;
        while (x !== this.NIL) {
          y = x;
          if (z.value < x.value) x = x.left;
          else x = x.right;
        }
        z.parent = y;
        if (y === this.NIL) this.root = z;
        else if (z.value < y.value) y.left = z;
        else y.right = z;

        this.insertFix(z);
        return true;
      }

      insertFix(z) {
        while (z.parent.color === RED) {
          if (z.parent === z.parent.parent.left) {
            const y = z.parent.parent.right;
            if (y.color === RED) {
              z.parent.color = BLACK;
              y.color = BLACK;
              z.parent.parent.color = RED;
              z = z.parent.parent;
            } else {
              if (z === z.parent.right) {
                z = z.parent;
                this.leftRotate(z);
              }
              z.parent.color = BLACK;
              z.parent.parent.color = RED;
              this.rightRotate(z.parent.parent);
            }
          } else {
            const y = z.parent.parent.left;
            if (y.color === RED) {
              z.parent.color = BLACK;
              y.color = BLACK;
              z.parent.parent.color = RED;
              z = z.parent.parent;
            } else {
              if (z === z.parent.left) {
                z = z.parent;
                this.rightRotate(z);
              }
              z.parent.color = BLACK;
              z.parent.parent.color = RED;
              this.leftRotate(z.parent.parent);
            }
          }
        }
        this.root.color = BLACK;
      }

      transplant(u, v) {
        if (u.parent === this.NIL) this.root = v;
        else if (u === u.parent.left) u.parent.left = v;
        else u.parent.right = v;
        v.parent = u.parent;
      }

      minimum(node) {
        let cur = node;
        while (cur.left !== this.NIL) cur = cur.left;
        return cur;
      }

      delete(value) {
        const z = this.searchNode(value);
        if (z === this.NIL) return false;

        let y = z;
        let yOriginalColor = y.color;
        let x;

        if (z.left === this.NIL) {
          x = z.right;
          this.transplant(z, z.right);
        } else if (z.right === this.NIL) {
          x = z.left;
          this.transplant(z, z.left);
        } else {
          y = this.minimum(z.right);
          yOriginalColor = y.color;
          x = y.right;
          if (y.parent === z) {
            x.parent = y;
          } else {
            this.transplant(y, y.right);
            y.right = z.right;
            y.right.parent = y;
          }
          this.transplant(z, y);
          y.left = z.left;
          y.left.parent = y;
          y.color = z.color;
        }

        if (yOriginalColor === BLACK) this.deleteFix(x);
        return true;
      }

      deleteFix(x) {
        while (x !== this.root && x.color === BLACK) {
          if (x === x.parent.left) {
            let w = x.parent.right;
            if (w.color === RED) {
              w.color = BLACK;
              x.parent.color = RED;
              this.leftRotate(x.parent);
              w = x.parent.right;
            }
            if (w.left.color === BLACK && w.right.color === BLACK) {
              w.color = RED;
              x = x.parent;
            } else {
              if (w.right.color === BLACK) {
                w.left.color = BLACK;
                w.color = RED;
                this.rightRotate(w);
                w = x.parent.right;
              }
              w.color = x.parent.color;
              x.parent.color = BLACK;
              w.right.color = BLACK;
              this.leftRotate(x.parent);
              x = this.root;
            }
          } else {
            let w = x.parent.left;
            if (w.color === RED) {
              w.color = BLACK;
              x.parent.color = RED;
              this.rightRotate(x.parent);
              w = x.parent.left;
            }
            if (w.right.color === BLACK && w.left.color === BLACK) {
              w.color = RED;
              x = x.parent;
            } else {
              if (w.left.color === BLACK) {
                w.right.color = BLACK;
                w.color = RED;
                this.leftRotate(w);
                w = x.parent.left;
              }
              w.color = x.parent.color;
              x.parent.color = BLACK;
              w.left.color = BLACK;
              this.rightRotate(x.parent);
              x = this.root;
            }
          }
        }
        x.color = BLACK;
      }

      searchNode(value) {
        let cur = this.root;
        while (cur !== this.NIL) {
          if (value < cur.value) cur = cur.left;
          else if (value > cur.value) cur = cur.right;
          else return cur;
        }
        return this.NIL;
      }

      nodeHeight(value) {
        const node = this.searchNode(value);
        if (node === this.NIL) return -1;
        return this.subtreeHeight(node);
      }

      subtreeHeight(node) {
        if (node === this.NIL) return 0;
        return 1 + Math.max(this.subtreeHeight(node.left), this.subtreeHeight(node.right));
      }

      treeHeight() {
        return this.subtreeHeight(this.root);
      }

      blackHeightFromRoot() {
        let cur = this.root;
        let count = 0;
        while (cur !== this.NIL) {
          if (cur.color === BLACK) count++;
          cur = cur.left;
        }
        return count + 1;
      }

      countNodes(node = this.root) {
        if (node === this.NIL) return 0;
        return 1 + this.countNodes(node.left) + this.countNodes(node.right);
      }

      preorder(node = this.root, out = []) {
        if (node === this.NIL) return out;
        out.push(`${node.value}[${node.color[0]}]`);
        this.preorder(node.left, out);
        this.preorder(node.right, out);
        return out;
      }

      inorder(node = this.root, out = []) {
        if (node === this.NIL) return out;
        this.inorder(node.left, out);
        out.push(`${node.value}[${node.color[0]}]`);
        this.inorder(node.right, out);
        return out;
      }

      postorder(node = this.root, out = []) {
        if (node === this.NIL) return out;
        this.postorder(node.left, out);
        this.postorder(node.right, out);
        out.push(`${node.value}[${node.color[0]}]`);
        return out;
      }

      levelorder() {
        if (this.root === this.NIL) return [];
        const out = [];
        const q = [this.root];
        while (q.length) {
          const n = q.shift();
          out.push(`${n.value}[${n.color[0]}]`);
          if (n.left !== this.NIL) q.push(n.left);
          if (n.right !== this.NIL) q.push(n.right);
        }
        return out;
      }

      toTextTree() {
        if (this.root === this.NIL) return "(empty)";
        const lines = [];
        const walk = (node, prefix, isLeft) => {
          if (node === this.NIL) return;
          lines.push(`${prefix}${isLeft ? "L-- " : "R-- "}${node.value}[${node.color[0]}]`);
          walk(node.left, `${prefix}${isLeft ? "|   " : "    "}`, true);
          walk(node.right, `${prefix}${isLeft ? "|   " : "    "}`, false);
        };
        lines.push(`ROOT ${this.root.value}[${this.root.color[0]}]`);
        walk(this.root.left, "", true);
        walk(this.root.right, "", false);
        return lines.join("\n");
      }
    }

    const tree = new RBTree();
    const valueInput = document.getElementById("valueInput");
    const output = document.getElementById("output");
    const stats = document.getElementById("stats");
    const treeText = document.getElementById("treeText");
    const svg = document.getElementById("treeSvg");

    const setOutput = (msg) => {
      output.textContent = msg;
    };

    const parseSingleInt = () => {
      const raw = valueInput.value.trim();
      if (!raw) return null;
      const num = Number(raw);
      return Number.isInteger(num) ? num : null;
    };

    const updateStats = () => {
      const count = tree.countNodes();
      const height = tree.treeHeight();
      const bh = tree.isEmpty() ? 0 : tree.blackHeightFromRoot();
      const root = tree.root === tree.NIL ? "None" : `${tree.root.value}[${tree.root.color[0]}]`;
      stats.innerHTML = `
        <span class="chip">Nodes: ${count}</span>
        <span class="chip">Tree Height: ${height}</span>
        <span class="chip">Black Height: ${bh}</span>
        <span class="chip">Root: ${root}</span>
      `;
    };

    const renderAll = () => {
      updateStats();
      treeText.textContent = tree.toTextTree();
      drawTree();
    };

    const computeDepth = (node) => {
      if (node === tree.NIL) return 0;
      return 1 + Math.max(computeDepth(node.left), computeDepth(node.right));
    };

    const drawTree = () => {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      if (tree.root === tree.NIL) return;

      const depth = computeDepth(tree.root);
      const width = Math.max(960, Math.pow(2, depth) * 62);
      const height = Math.max(520, depth * 120);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const edges = [];
      const nodes = [];

      const place = (node, x1, x2, y) => {
        if (node === tree.NIL) return;
        const x = (x1 + x2) / 2;
        nodes.push({ node, x, y });

        if (node.left !== tree.NIL) {
          const lx = (x1 + x) / 2;
          const ly = y + 95;
          edges.push({ x1: x, y1: y, x2: lx, y2: ly });
          place(node.left, x1, x, ly);
        }
        if (node.right !== tree.NIL) {
          const rx = (x + x2) / 2;
          const ry = y + 95;
          edges.push({ x1: x, y1: y, x2: rx, y2: ry });
          place(node.right, x, x2, ry);
        }
      };

      place(tree.root, 25, width - 25, 48);

      edges.forEach((e) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", e.x1);
        line.setAttribute("y1", e.y1 + 21);
        line.setAttribute("x2", e.x2);
        line.setAttribute("y2", e.y2 - 21);
        line.setAttribute("stroke", "#43638a");
        line.setAttribute("stroke-width", "3");
        svg.appendChild(line);
      });

      nodes.forEach((item) => {
        const { node, x, y } = item;
        const fill = node.color === RED ? "#e63946" : "#1f2937";
        const stroke = node.color === RED ? "#9f1239" : "#0b132b";

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", x);
        c.setAttribute("cy", y);
        c.setAttribute("r", 28);
        c.setAttribute("fill", fill);
        c.setAttribute("stroke", stroke);
        c.setAttribute("stroke-width", "3");

        const tValue = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tValue.setAttribute("x", x);
        tValue.setAttribute("y", y + 4);
        tValue.setAttribute("text-anchor", "middle");
        tValue.setAttribute("fill", "#fff");
        tValue.setAttribute("font-size", "14");
        tValue.setAttribute("font-weight", "800");
        tValue.textContent = node.value;

        const tColor = document.createElementNS("http://www.w3.org/2000/svg", "text");
        tColor.setAttribute("x", x);
        tColor.setAttribute("y", y + 43);
        tColor.setAttribute("text-anchor", "middle");
        tColor.setAttribute("fill", "#132238");
        tColor.setAttribute("font-size", "12");
        tColor.setAttribute("font-weight", "800");
        tColor.textContent = node.color;

        g.appendChild(c);
        g.appendChild(tValue);
        g.appendChild(tColor);
        svg.appendChild(g);
      });
    };

    document.getElementById("insertBtn").addEventListener("click", () => {
      const v = parseSingleInt();
      if (v === null) return setOutput("Enter a valid integer first.");
      const ok = tree.insert(v);
      setOutput(ok ? `Inserted ${v}. Red-Black properties restored.` : `${v} already exists. Duplicate ignored.`);
      renderAll();
    });

    document.getElementById("deleteBtn").addEventListener("click", () => {
      const v = parseSingleInt();
      if (v === null) return setOutput("Enter a valid integer first.");
      const ok = tree.delete(v);
      setOutput(ok ? `Deleted ${v}. Red-Black properties restored.` : `${v} not found.`);
      renderAll();
    });

    document.getElementById("searchBtn").addEventListener("click", () => {
      const v = parseSingleInt();
      if (v === null) return setOutput("Enter a valid integer first.");
      const node = tree.searchNode(v);
      if (node === tree.NIL) setOutput(`${v} not found.`);
      else setOutput(`Found ${v}. Color: ${node.color}.`);
    });

    document.getElementById("heightBtn").addEventListener("click", () => {
      const v = parseSingleInt();
      if (v === null) return setOutput("Enter a valid integer first.");
      const h = tree.nodeHeight(v);
      if (h === -1) setOutput(`Node ${v} not found.`);
      else setOutput(`Height of node ${v} is ${h}.`);
    });

    document.getElementById("preBtn").addEventListener("click", () => {
      setOutput(`Preorder: ${tree.preorder().join(" ") || "(empty)"}`);
    });

    document.getElementById("inBtn").addEventListener("click", () => {
      setOutput(`Inorder: ${tree.inorder().join(" ") || "(empty)"}`);
    });

    document.getElementById("postBtn").addEventListener("click", () => {
      setOutput(`Postorder: ${tree.postorder().join(" ") || "(empty)"}`);
    });

    document.getElementById("levelBtn").addEventListener("click", () => {
      setOutput(`Levelorder: ${tree.levelorder().join(" ") || "(empty)"}`);
    });

    document.getElementById("blackBtn").addEventListener("click", () => {
      const bh = tree.isEmpty() ? 0 : tree.blackHeightFromRoot();
      setOutput(`Black Height (from root to NIL) = ${bh}.`);
    });

    document.getElementById("printBtn").addEventListener("click", () => {
      treeText.textContent = tree.toTextTree();
      setOutput("Printed current tree in text panel.");
    });

    document.getElementById("bulkBtn").addEventListener("click", () => {
      const raw = valueInput.value.trim();
      if (!raw) return setOutput("Enter comma-separated integers, e.g. 10,20,30");
      const items = raw.split(",").map((x) => x.trim()).filter((x) => x.length);
      if (!items.length) return setOutput("No values detected.");
      let inserted = 0;
      for (const s of items) {
        const num = Number(s);
        if (Number.isInteger(num) && tree.insert(num)) inserted++;
      }
      setOutput(`Bulk insert complete. Added ${inserted} node(s).`);
      renderAll();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      tree.root = tree.NIL;
      setOutput("Tree cleared.");
      renderAll();
    });

    valueInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("insertBtn").click();
    });

    renderAll();
  </script>
</body>
</html>
