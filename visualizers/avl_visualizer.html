<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVL Tree Visualizer</title>
  <style>
    :root {
      --bg-1: #0b132b;
      --bg-2: #1c2541;
      --card: #f4f7ff;
      --ink: #10213f;
      --accent-1: #00a8e8;
      --accent-2: #3a86ff;
      --accent-3: #2ec4b6;
      --danger: #ef476f;
      --warn: #ff9f1c;
      --ok: #2a9d8f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1d3557 0%, var(--bg-1) 45%),
                  linear-gradient(140deg, var(--bg-2) 0%, var(--bg-1) 100%);
      color: #ecf3ff;
      padding: 24px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
    }

    .title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .sub {
      color: #c8d9ff;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .row {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      color: #d8e5ff;
      font-weight: 600;
    }

    input {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: #eef4ff;
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .insert { background: linear-gradient(135deg, var(--ok), #33b39d); }
    .delete { background: linear-gradient(135deg, var(--danger), #c11245); }
    .query  { background: linear-gradient(135deg, var(--warn), #f77f00); }
    .action { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); }
    .reset  { background: linear-gradient(135deg, #7f8fa6, #57606f); }

    .output {
      margin-top: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.9rem;
      min-height: 70px;
      white-space: pre-wrap;
      line-height: 1.4;
      color: #e9f2ff;
    }

    .viewer {
      display: grid;
      gap: 12px;
      grid-template-rows: auto 1fr auto;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.84rem;
      color: #dbe8ff;
      font-weight: 600;
    }

    .canvas {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid #c8d9ff;
      overflow: auto;
      min-height: 540px;
      padding: 10px;
    }

    svg {
      width: 100%;
      height: 100%;
      min-height: 520px;
    }

    .tree-text {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.9rem;
      min-height: 130px;
      white-space: pre;
      overflow: auto;
      color: #e9f2ff;
    }

    @media (max-width: 980px) {
      .container {
        grid-template-columns: 1fr;
      }
      .canvas {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="panel">
      <div class="title">AVL Visualizer</div>
      <div class="sub">Insert, delete, traverse, check node heights, and print the balanced tree.</div>

      <div class="controls">
        <div class="row">
          <label for="valueInput">Node Value</label>
          <input id="valueInput" type="number" placeholder="e.g. 42" />
        </div>

        <div class="btn-grid">
          <button class="insert" id="insertBtn">Insert</button>
          <button class="delete" id="deleteBtn">Delete</button>
          <button class="query" id="heightBtn">Node Height</button>
          <button class="action" id="printBtn">Print Tree</button>
        </div>

        <div class="btn-grid">
          <button class="action" id="preBtn">Preorder</button>
          <button class="action" id="inBtn">Inorder</button>
          <button class="action" id="postBtn">Postorder</button>
          <button class="action" id="levelBtn">Levelorder</button>
        </div>

        <div class="btn-grid">
          <button class="action" id="bulkBtn">Insert CSV</button>
          <button class="reset" id="clearBtn">Clear Tree</button>
        </div>

        <div class="output" id="output">Ready.</div>
      </div>
    </aside>

    <section class="panel viewer">
      <div class="stats" id="stats"></div>
      <div class="canvas">
        <svg id="treeSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <pre class="tree-text" id="treeText">Tree print will appear here.</pre>
    </section>
  </div>

  <script>
    class AVLNode {
      constructor(value) {
        this.value = value;
        this.height = 1;
        this.left = null;
        this.right = null;
      }
    }

    class AVLTree {
      constructor() {
        this.root = null;
      }

      getHeight(node) {
        return node ? node.height : 0;
      }

      updateHeight(node) {
        node.height = 1 + Math.max(this.getHeight(node.left), this.getHeight(node.right));
      }

      getBalance(node) {
        return node ? this.getHeight(node.left) - this.getHeight(node.right) : 0;
      }

      rotateRight(y) {
        const x = y.left;
        const t2 = x.right;
        x.right = y;
        y.left = t2;
        this.updateHeight(y);
        this.updateHeight(x);
        return x;
      }

      rotateLeft(x) {
        const y = x.right;
        const t2 = y.left;
        y.left = x;
        x.right = t2;
        this.updateHeight(x);
        this.updateHeight(y);
        return y;
      }

      rebalance(node) {
        this.updateHeight(node);
        const bf = this.getBalance(node);

        if (bf > 1) {
          if (this.getBalance(node.left) < 0) {
            node.left = this.rotateLeft(node.left);
          }
          return this.rotateRight(node);
        }

        if (bf < -1) {
          if (this.getBalance(node.right) > 0) {
            node.right = this.rotateRight(node.right);
          }
          return this.rotateLeft(node);
        }

        return node;
      }

      insert(value) {
        let inserted = false;
        const walk = (node, v) => {
          if (!node) {
            inserted = true;
            return new AVLNode(v);
          }
          if (v < node.value) node.left = walk(node.left, v);
          else if (v > node.value) node.right = walk(node.right, v);
          else return node;
          return this.rebalance(node);
        };
        this.root = walk(this.root, value);
        return inserted;
      }

      minNode(node) {
        let cur = node;
        while (cur && cur.left) cur = cur.left;
        return cur;
      }

      delete(value) {
        let removed = false;
        const walk = (node, v) => {
          if (!node) return null;
          if (v < node.value) node.left = walk(node.left, v);
          else if (v > node.value) node.right = walk(node.right, v);
          else {
            removed = true;
            if (!node.left || !node.right) {
              return node.left ? node.left : node.right;
            }
            const succ = this.minNode(node.right);
            node.value = succ.value;
            node.right = walk(node.right, succ.value);
          }
          if (!node) return null;
          return this.rebalance(node);
        };
        this.root = walk(this.root, value);
        return removed;
      }

      findHeight(value) {
        let cur = this.root;
        while (cur) {
          if (value < cur.value) cur = cur.left;
          else if (value > cur.value) cur = cur.right;
          else return cur.height;
        }
        return -1;
      }

      preorder(node = this.root, out = []) {
        if (!node) return out;
        out.push(`${node.value}(${node.height})`);
        this.preorder(node.left, out);
        this.preorder(node.right, out);
        return out;
      }

      inorder(node = this.root, out = []) {
        if (!node) return out;
        this.inorder(node.left, out);
        out.push(`${node.value}(${node.height})`);
        this.inorder(node.right, out);
        return out;
      }

      postorder(node = this.root, out = []) {
        if (!node) return out;
        this.postorder(node.left, out);
        this.postorder(node.right, out);
        out.push(`${node.value}(${node.height})`);
        return out;
      }

      levelorder() {
        if (!this.root) return [];
        const out = [];
        const q = [this.root];
        while (q.length) {
          const n = q.shift();
          out.push(`${n.value}(${n.height})`);
          if (n.left) q.push(n.left);
          if (n.right) q.push(n.right);
        }
        return out;
      }

      countNodes(node = this.root) {
        if (!node) return 0;
        return 1 + this.countNodes(node.left) + this.countNodes(node.right);
      }

      toTextTree() {
        if (!this.root) return "(empty)";
        const lines = [];
        const walk = (node, prefix, isLeft) => {
          if (!node) return;
          lines.push(`${prefix}${isLeft ? "L-- " : "R-- "}${node.value}(${node.height})`);
          walk(node.left, `${prefix}${isLeft ? "|   " : "    "}`, true);
          walk(node.right, `${prefix}${isLeft ? "|   " : "    "}`, false);
        };
        lines.push(`ROOT ${this.root.value}(${this.root.height})`);
        walk(this.root.left, "", true);
        walk(this.root.right, "", false);
        return lines.join("\n");
      }
    }

    const tree = new AVLTree();
    const valueInput = document.getElementById("valueInput");
    const output = document.getElementById("output");
    const stats = document.getElementById("stats");
    const treeText = document.getElementById("treeText");
    const svg = document.getElementById("treeSvg");

    const readValue = () => {
      const raw = valueInput.value.trim();
      if (raw === "") return null;
      const v = Number(raw);
      return Number.isInteger(v) ? v : null;
    };

    const setOutput = (msg) => {
      output.textContent = msg;
    };

    const updateStats = () => {
      const h = tree.getHeight(tree.root);
      const n = tree.countNodes();
      const rootText = tree.root ? `${tree.root.value}(${tree.root.height})` : "None";
      stats.innerHTML = `
        <span class="chip">Nodes: ${n}</span>
        <span class="chip">Tree Height: ${h}</span>
        <span class="chip">Root: ${rootText}</span>
      `;
    };

    const render = () => {
      updateStats();
      treeText.textContent = tree.toTextTree();
      drawTree();
    };

    const computeDepth = (node) => {
      if (!node) return 0;
      return 1 + Math.max(computeDepth(node.left), computeDepth(node.right));
    };

    const drawTree = () => {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      if (!tree.root) return;

      const depth = computeDepth(tree.root);
      const width = Math.max(900, Math.pow(2, depth) * 58);
      const height = Math.max(500, depth * 120);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const nodes = [];
      const edges = [];

      const place = (node, x1, x2, y) => {
        if (!node) return;
        const x = (x1 + x2) / 2;
        const item = { node, x, y };
        nodes.push(item);

        if (node.left) {
          const lx = (x1 + x) / 2;
          const ly = y + 95;
          edges.push({ x1: x, y1: y, x2: lx, y2: ly });
          place(node.left, x1, x, ly);
        }
        if (node.right) {
          const rx = (x + x2) / 2;
          const ry = y + 95;
          edges.push({ x1: x, y1: y, x2: rx, y2: ry });
          place(node.right, x, x2, ry);
        }
      };

      place(tree.root, 25, width - 25, 48);

      edges.forEach((e) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", e.x1);
        line.setAttribute("y1", e.y1 + 20);
        line.setAttribute("x2", e.x2);
        line.setAttribute("y2", e.y2 - 20);
        line.setAttribute("stroke", "#355070");
        line.setAttribute("stroke-width", "3");
        svg.appendChild(line);
      });

      nodes.forEach((n) => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", n.x);
        circle.setAttribute("cy", n.y);
        circle.setAttribute("r", 28);
        circle.setAttribute("fill", "#3a86ff");
        circle.setAttribute("stroke", "#023e8a");
        circle.setAttribute("stroke-width", "3");

        const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t1.setAttribute("x", n.x);
        t1.setAttribute("y", n.y + 3);
        t1.setAttribute("text-anchor", "middle");
        t1.setAttribute("font-size", "14");
        t1.setAttribute("font-weight", "800");
        t1.setAttribute("fill", "#ffffff");
        t1.textContent = n.node.value;

        const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t2.setAttribute("x", n.x);
        t2.setAttribute("y", n.y + 44);
        t2.setAttribute("text-anchor", "middle");
        t2.setAttribute("font-size", "12");
        t2.setAttribute("font-weight", "700");
        t2.setAttribute("fill", "#1b2a41");
        t2.textContent = `h=${n.node.height}`;

        g.appendChild(circle);
        g.appendChild(t1);
        g.appendChild(t2);
        svg.appendChild(g);
      });
    };

    document.getElementById("insertBtn").addEventListener("click", () => {
      const v = readValue();
      if (v === null) return setOutput("Enter a valid integer first.");
      const ok = tree.insert(v);
      setOutput(ok ? `Inserted ${v}. Tree rebalanced.` : `${v} already exists. Duplicate ignored.`);
      render();
    });

    document.getElementById("deleteBtn").addEventListener("click", () => {
      const v = readValue();
      if (v === null) return setOutput("Enter a valid integer first.");
      const ok = tree.delete(v);
      setOutput(ok ? `Deleted ${v}. Tree rebalanced.` : `${v} not found.`);
      render();
    });

    document.getElementById("heightBtn").addEventListener("click", () => {
      const v = readValue();
      if (v === null) return setOutput("Enter a valid integer first.");
      const h = tree.findHeight(v);
      setOutput(h === -1 ? `Node ${v} not present in tree.` : `Height of node ${v} is ${h}.`);
    });

    document.getElementById("printBtn").addEventListener("click", () => {
      treeText.textContent = tree.toTextTree();
      setOutput("Printed current tree in text panel.");
    });

    document.getElementById("preBtn").addEventListener("click", () => {
      setOutput(`Preorder: ${tree.preorder().join(" ") || "(empty)"}`);
    });

    document.getElementById("inBtn").addEventListener("click", () => {
      setOutput(`Inorder: ${tree.inorder().join(" ") || "(empty)"}`);
    });

    document.getElementById("postBtn").addEventListener("click", () => {
      setOutput(`Postorder: ${tree.postorder().join(" ") || "(empty)"}`);
    });

    document.getElementById("levelBtn").addEventListener("click", () => {
      setOutput(`Levelorder: ${tree.levelorder().join(" ") || "(empty)"}`);
    });

    document.getElementById("bulkBtn").addEventListener("click", () => {
      const raw = valueInput.value.trim();
      if (!raw) return setOutput("Enter comma-separated integers, e.g. 10,20,30");
      const parts = raw.split(",").map((x) => x.trim()).filter((x) => x.length);
      if (!parts.length) return setOutput("No valid values found.");
      let inserted = 0;
      for (const p of parts) {
        const v = Number(p);
        if (Number.isInteger(v)) {
          if (tree.insert(v)) inserted++;
        }
      }
      setOutput(`Bulk insert complete. Added ${inserted} node(s).`);
      render();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      tree.root = null;
      setOutput("Tree cleared.");
      render();
    });

    valueInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        document.getElementById("insertBtn").click();
      }
    });

    render();
  </script>
</body>
</html>
